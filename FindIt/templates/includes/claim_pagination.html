{% if page_obj.has_other_pages %}<nav class="claim-tabs mt-4" aria-label="Pagination">{% if page_obj.has_previous %}<a class="btn btn-outline-primary" href="?page={{ page_obj.previous_page_number }}{% if received %}&amp;tab=received{% endif %}">Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="btn btn-outline-primary" href="?page={{ page_obj.next_page_number }}{% if received %}&amp;tab=received{% endif %}">Next</a>{% endif %}</nav>{% endif %}
