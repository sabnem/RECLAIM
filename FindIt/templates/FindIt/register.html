{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 rounded-4 feature-card" style="background: var(--surface);">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus display-3" style="color: var(--primary);"></i>
                    <h2 class="fw-bold mt-2">Create Account</h2>
                    <p class="text-muted">Join the Lost & Found community</p>
                </div>
                <form method="post">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <div class="form-check mt-3">
                                <input class="form-check-input" type="checkbox" id="agreeTerms" name="agree_terms" required>
                                <label class="form-check-label" for="agreeTerms">
                                    I have read and agree to the <a href="{% url 'terms_and_conditions' %}" target="_blank" style="color: var(--primary);">Terms and Conditions</a>.
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-3 rounded-pill" style="background: var(--primary); border-color: var(--primary);">Register</button>
                </form>
                <p class="mt-4 text-center">Already have an account? <a href="{% url 'login' %}" style="color: var(--primary);">Login here</a>.</p>
            </div>
        </div>
    </div>
</div>

<style>
    .password-toggle-container {
        position: relative;
        display: flex;
        align-items: center;
    }

    .password-toggle-btn {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--primary);
        font-size: 1.1rem;
        padding: 5px;
        transition: all 0.3s ease;
    }

    .password-toggle-btn:hover {
        transform: scale(1.2);
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordField = document.getElementById('id_password_register');
        
        if (passwordField) {
            // Wrap password field with container for toggle button
            const wrapper = document.createElement('div');
            wrapper.className = 'password-toggle-container';
            wrapper.style.position = 'relative';
            
            // Insert wrapper before password field
            passwordField.parentNode.insertBefore(wrapper, passwordField);
            
            // Move password field into wrapper
            wrapper.appendChild(passwordField);
            
            // Create toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.type = 'button';
            toggleBtn.className = 'password-toggle-btn';
            toggleBtn.innerHTML = '<i class="bi bi-eye"></i>';
            toggleBtn.title = 'Show/hide password';
            toggleBtn.style.position = 'absolute';
            toggleBtn.style.right = '12px';
            toggleBtn.style.top = '50%';
            toggleBtn.style.transform = 'translateY(-50%)';
            toggleBtn.style.paddingRight = '0';
            
            // Add to wrapper
            wrapper.appendChild(toggleBtn);
            
            // Add padding to password field for the button
            passwordField.style.paddingRight = '40px';
            
            // Toggle functionality
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                
                // Update icon
                if (type === 'text') {
                    toggleBtn.innerHTML = '<i class="bi bi-eye-slash"></i>';
                } else {
                    toggleBtn.innerHTML = '<i class="bi bi-eye"></i>';
                }
            });
        }
    });
</script>
{% endblock %}
